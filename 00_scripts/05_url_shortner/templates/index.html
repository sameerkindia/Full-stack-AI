<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL shortner</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-300 text-gray-800 p-6">
    <diV class="max-w-2xl mx-auto">
        <h1 class="text-3xl font-bold mb-6 text-center text-blue-600">Python url shortner</h1>
        <form method="POST" class="bg-white shadow-md rounded p-6 mb-6 space-y-4">
            <label class="block">
                <span class="text-gray-700">Enter a long URL</span>
                <input
                type="text"
                name="url"
                placeholder="https://example.com/veryLongUrl"
                required
                class="mt-1 block w-full border border-gray-300 rounded p-2"
                >
            </label>
            <button class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700" type="submit">Shorten</button>
        </form>
        <h2 class="text-xl font-semibold mb-4">Shortened URLs</h2>
        {% if all_urls %}
            <div class="bg-white shadow-md rounded overflow-hidden">
                <table class="w-full text-left">
                    <thead class="bg-gray-100">
                        <tr>
                            <th class="text-sm px-6 py-3 font-semibold">Short URL</th>
                            <th class="text-sm px-6 py-3 font-semibold">Original URL</th>
                            <th class="text-sm px-6 py-3 font-semibold">Visits</th>
                            <th class="text-sm px-6 py-3 font-semibold">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for url in all_urls %}
                            <tr class="border-t border-gray-200">
                                <td class="px-6 py-3">
                                    <a href="/{{ url[1] }}" target="_blank" class="text-blue-600 hover:underline">{{ url[1] }}</a>
                                </td>
                                <td class="px-6 py-3 truncate max-w-sm">{{ url[0] }}</td>
                                <td class="px-6 py-3">{{ url[2] }}</td>
                                <td class="px-6 py-3">
                                    <form method="POST" action="/delete/{{ url[1] }}" class="inline" onsubmit="return confirm('Are you sure you want to delete this URL?');">
                                        <button type="submit" class="bg-red-600 text-white px-3 py-1 rounded hover:bg-red-700">Delete</button>
                                    </form>
                                    
                                </td>
                            </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        {% else %}
            <p class="bg-white shadow-md rounded p-6 text-gray-500 text-center">No shortened URLs yet.</p>
        {% endif %}
    </diV>
</body>
</html>
